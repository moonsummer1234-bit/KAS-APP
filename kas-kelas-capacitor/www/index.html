<script>
/* ==========================================================================
   STATE MANAGEMENT
   ========================================================================== */
const STORAGE_KEY = 'kaskelas_app_state_v2';
const OLD_STORAGE_KEY = 'kaskelas_app_state_v1';
const BULAN_LIST = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function uid(prefix='id'){ return prefix + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function defaultState(){
  const walletId = uid('wal');
  return {
    students: [],
    wallets: [{ id: walletId, name: 'Kas Mingguan Utama', weeklyAmount: 5000, months: [], paymentItems: [] }],
    activeWalletId: walletId,
    kasData: {},
    paymentData: {},   // walletId -> itemId -> studentId -> {status:'beli'|'tidak'|'', paid:bool}
    expenses: {}        // walletId -> monthLabel -> [{id, desc, price, qty}]
  };
}

// Migrasi dari struktur data versi lama (v1: bookAmount tunggal & bookData & expenses flat array)
function migrateFromV1(){
  try {
    const raw = localStorage.getItem(OLD_STORAGE_KEY);
    if(!raw) return null;
    const old = JSON.parse(raw);
    if(!old.wallets) return null;
    const migrated = {
      students: old.students || [],
      wallets: old.wallets.map(w => ({
        id: w.id, name: w.name, weeklyAmount: w.weeklyAmount || 5000,
        months: w.months || [],
        paymentItems: w.bookAmount ? [{ id: uid('item'), name: 'Buku Pelajaran', amount: w.bookAmount, type: 'buku' }] : []
      })),
      activeWalletId: old.activeWalletId,
      kasData: old.kasData || {},
      paymentData: {},
      expenses: {}
    };
    // migrasi bookData -> paymentData memakai item "Buku Pelajaran" yang baru dibuat per wallet
    migrated.wallets.forEach(w => {
      const bookItem = w.paymentItems[0];
      if(bookItem && old.bookData && old.bookData[w.id]){
        migrated.paymentData[w.id] = { [bookItem.id]: old.bookData[w.id] };
      }
    });
    // migrasi expenses (array flat) -> dikelompokkan ke bulan "Umum (Migrasi)"
    Object.keys(old.expenses || {}).forEach(walletId => {
      const list = old.expenses[walletId];
      if(Array.isArray(list) && list.length){
        migrated.expenses[walletId] = { 'Umum (Migrasi)': list };
      }
    });
    return migrated;
  } catch(e){ return null; }
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.wallets && parsed.wallets.length) return normalizeState(parsed);
    }
    const migrated = migrateFromV1();
    if(migrated) return normalizeState(migrated);
    return defaultState();
  } catch(e){
    console.error('Gagal memuat data, menggunakan data default.', e);
    return defaultState();
  }
}

// Pastikan semua field yang dibutuhkan selalu ada (jaga-jaga data lama/parsial)
function normalizeState(s){
  s.students = s.students || [];
  s.wallets = (s.wallets || []).map(w => ({
    id: w.id, name: w.name || 'Wallet', weeklyAmount: w.weeklyAmount ?? 5000,
    months: w.months || [], paymentItems: w.paymentItems || []
  }));
  if(s.wallets.length === 0) return defaultState();
  s.activeWalletId = s.activeWalletId && s.wallets.find(w=>w.id===s.activeWalletId) ? s.activeWalletId : s.wallets[0].id;
  s.kasData = s.kasData || {};
  s.paymentData = s.paymentData || {};
  s.expenses = s.expenses || {};
  return s;
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){
    showToast('Gagal menyimpan data (penyimpanan penuh?)', 'error');
  }
}

let state = loadState();
saveState();
let currentTab = 'dashboard';
let selectedMonth = null;         // untuk tab Kas Mingguan
let selectedExpenseMonth = null;  // untuk tab Pengeluaran
let selectedBukuItemId = null;    // untuk tab Pembayaran Buku
let selectedLainnyaItemId = null; // untuk tab Pembayaran Lainnya

/* ==========================================================================
   UTILITIES
   ========================================================================== */
function formatRupiah(num){
  num = Math.round(num || 0);
  return 'Rp ' + num.toLocaleString('id-ID');
}
function getWallet(id){ return state.wallets.find(w => w.id === id); }
function getActiveWallet(){ return getWallet(state.activeWalletId); }
function escapeHtml(str){ const d = document.createElement('div'); d.innerText = str ?? ''; return d.innerHTML; }

function showToast(msg, type='success'){
  const host = document.getElementById('toastHost');
  const colors = { success: 'bg-teal-700', error: 'bg-rose-600', info: 'bg-slate-700' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]||colors.success} text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 max-w-xs`;
  el.innerHTML = `<span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity = '0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 2400);
}

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalHost').classList.remove('hidden');
  document.getElementById('modalHost').classList.add('flex');
}
function closeModal(){
  document.getElementById('modalHost').classList.add('hidden');
  document.getElementById('modalHost').classList.remove('flex');
}
document.getElementById('modalHost').addEventListener('click', (e)=>{ if(e.target.id === 'modalHost') closeModal(); });

function confirmModal(title, desc, onConfirm){
  const id = 'confirmBtn_' + uid();
  setTimeout(() => { document.getElementById(id).addEventListener('click', onConfirm); }, 0);
  return `
    <h3 class="font-display font-bold text-lg text-slate-900 mb-2">${title}</h3>
    <p class="text-sm text-slate-500 mb-5">${desc}</p>
    <div class="flex justify-end gap-2">
      <button onclick="closeModal()" class="text-sm font-semibold px-4 py-2 rounded-lg border border-ledger-line text-slate-600 hover:bg-slate-50">Batal</button>
      <button id="${id}" class="text-sm font-semibold px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white">Ya, Hapus</button>
    </div>`;
}

/* ==========================================================================
   DATA ACCESSORS
   ========================================================================== */
function ensureKasBucket(walletId, studentId, month){
  if(!state.kasData[walletId]) state.kasData[walletId] = {};
  if(!state.kasData[walletId][studentId]) state.kasData[walletId][studentId] = {};
  if(!state.kasData[walletId][studentId][month]) state.kasData[walletId][studentId][month] = { w1:false, w2:false, w3:false, w4:false };
  return state.kasData[walletId][studentId][month];
}
function ensurePaymentBucket(walletId, itemId, studentId){
  if(!state.paymentData[walletId]) state.paymentData[walletId] = {};
  if(!state.paymentData[walletId][itemId]) state.paymentData[walletId][itemId] = {};
  if(!state.paymentData[walletId][itemId][studentId]) state.paymentData[walletId][itemId][studentId] = { status: '', paid: false };
  return state.paymentData[walletId][itemId][studentId];
}
function ensureExpenseMonthBucket(walletId, month){
  if(!state.expenses[walletId]) state.expenses[walletId] = {};
  if(!state.expenses[walletId][month]) state.expenses[walletId][month] = [];
  return state.expenses[walletId][month];
}
function itemsByType(wallet, type){ return (wallet.paymentItems||[]).filter(i => i.type === type); }

/* ==========================================================================
   FINANCIAL COMPUTATION
   ========================================================================== */
function computeWalletFinance(walletId){
  const wallet = getWallet(walletId);
  let pemasukanKas = 0, tunggakanKas = 0;
  state.students.forEach(s => {
    (wallet.months||[]).forEach(month => {
      const rec = (state.kasData[walletId]||{})[s.id]?.[month] || { w1:false,w2:false,w3:false,w4:false };
      ['w1','w2','w3','w4'].forEach(w => { if(rec[w]) pemasukanKas += wallet.weeklyAmount; else tunggakanKas += wallet.weeklyAmount; });
    });
  });

  let pemasukanBuku = 0, tunggakanBuku = 0, pemasukanLainnya = 0, tunggakanLainnya = 0;
  (wallet.paymentItems||[]).forEach(item => {
    state.students.forEach(s => {
      const rec = (state.paymentData[walletId]||{})[item.id]?.[s.id] || { status:'', paid:false };
      if(rec.status === 'beli'){
        const target = item.type === 'buku' ? 'buku' : 'lainnya';
        if(rec.paid){ if(target==='buku') pemasukanBuku += item.amount; else pemasukanLainnya += item.amount; }
        else { if(target==='buku') tunggakanBuku += item.amount; else tunggakanLainnya += item.amount; }
      }
    });
  });

  let totalPengeluaran = 0;
  Object.values(state.expenses[walletId] || {}).forEach(list => {
    totalPengeluaran += list.reduce((sum,e) => sum + e.price*e.qty, 0);
  });

  const totalPemasukan = pemasukanKas + pemasukanBuku + pemasukanLainnya;
  const totalTunggakan = tunggakanKas + tunggakanBuku + tunggakanLainnya;
  const sisaKas = totalPemasukan - totalPengeluaran;
  return { pemasukanKas, tunggakanKas, pemasukanBuku, tunggakanBuku, pemasukanLainnya, tunggakanLainnya, totalPemasukan, totalPengeluaran, sisaKas, totalTunggakan };
}

function computeStudentDetail(walletId, studentId){
  const wallet = getWallet(walletId);
  let totalPaid = 0, totalTunggakan = 0;
  let mingguLunas = 0, mingguBelum = 0;
  const unpaidWeeks = [];
  const weekLabels = { w1:'Minggu 1', w2:'Minggu 2', w3:'Minggu 3', w4:'Minggu 4' };
  (wallet.months||[]).forEach(month => {
    const rec = (state.kasData[walletId]||{})[studentId]?.[month] || { w1:false,w2:false,w3:false,w4:false };
    ['w1','w2','w3','w4'].forEach(w => {
      if(rec[w]){ totalPaid += wallet.weeklyAmount; mingguLunas++; }
      else { totalTunggakan += wallet.weeklyAmount; mingguBelum++; unpaidWeeks.push(`${month} - ${weekLabels[w]}`); }
    });
  });

  const unpaidItems = [];
  let itemLunas = 0, itemBelum = 0;
  (wallet.paymentItems||[]).forEach(item => {
    const rec = (state.paymentData[walletId]||{})[item.id]?.[studentId] || { status:'', paid:false };
    if(item.status !== undefined){} // no-op guard
    if(rec.status === 'beli'){
      if(rec.paid){ totalPaid += item.amount; itemLunas++; }
      else { totalTunggakan += item.amount; itemBelum++; unpaidItems.push(`${item.name} (${item.type==='buku'?'Buku':'Lainnya'}) — ${formatRupiah(item.amount)}`); }
    }
  });

  return { totalPaid, totalTunggakan, mingguLunas, mingguBelum, unpaidWeeks, itemLunas, itemBelum, unpaidItems };
}

/* ==========================================================================
   RENDER: ROOT ROUTER
   ========================================================================== */
function render(){
  renderWalletSelector();
  renderNavActive();
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'fade-in';
  wrapper.id = 'tabContent';
  app.appendChild(wrapper);

  if(state.students.length === 0 && currentTab !== 'siswa' && currentTab !== 'pengaturan'){
    wrapper.innerHTML = emptyStateNoStudents();
    return;
  }
  switch(currentTab){
    case 'dashboard': renderDashboard(wrapper); break;
    case 'siswa': renderSiswa(wrapper); break;
    case 'kas': renderKas(wrapper); break;
    case 'buku': renderItemPayment(wrapper, 'buku'); break;
    case 'lainnya': renderItemPayment(wrapper, 'lainnya'); break;
    case 'pengeluaran': renderPengeluaran(wrapper); break;
    case 'pengaturan': renderPengaturan(wrapper); break;
  }
}
function emptyStateNoStudents(){
  return `
  <div class="bg-white border border-ledger-line rounded-2xl p-10 text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-teal-50 flex items-center justify-center mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    </div>
    <h3 class="font-display font-bold text-lg text-slate-800 mb-1">Belum ada data siswa</h3>

function summaryCard(label, value, borderColor, textColor, icon){

    wallet: '<path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h11a2 2 0 012 2v1h1a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM16 13h.01"/>',
    alert: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>'
  };
  return `
    <div class="card-hover bg-white border-l-4 ${borderColor} border-t border-r border-b border-ledger-line rounded-xl p-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">${label}</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 ${textColor}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${icons[icon]}</svg>
      </div>
      <p class="font-display font-extrabold text-lg sm:text-xl tabular-nums ${textColor}">${formatRupiah(value)}</p>
    </div>`;
}

/* ==========================================================================
   RENDER: PEMBAYARAN BUKU / LAINNYA (item custom, bisa ditambah bebas)
   ========================================================================== */
function renderItemPayment(root, type){
  const wallet = getActiveWallet();
  const items = itemsByType(wallet, type);
  const isBuku = type === 'buku';
  const label = isBuku ? 'Buku' : 'Lainnya';
  const addPlaceholder = isBuku ? 'Contoh: Buku Matematika Kelas 6' : 'Contoh: Iuran Seragam Olahraga';

  let selectedId = isBuku ? selectedBukuItemId : selectedLainnyaItemId;
  if(!selectedId || !items.find(i => i.id === selectedId)) selectedId = items.length ? items[0].id : null;
  if(isBuku) selectedBukuItemId = selectedId; else selectedLainnyaItemId = selectedId;

  root.innerHTML = `
    <h2 class="font-display font-extrabold text-2xl text-slate-900 mb-1">Pembayaran ${label}</h2>
    <p class="text-sm text-slate-500 mb-5">Wallet: <span class="font-semibold text-teal-700">${escapeHtml(wallet.name)}</span>. Tambahkan item ${label.toLowerCase()} dengan nominal custom, lalu tandai status tiap siswa.</p>

    <div class="bg-white border border-ledger-line rounded-2xl p-5 mb-5">
      <h3 class="font-display font-bold text-slate-800 mb-3 text-sm">+ Tambah Item ${label} Baru</h3>
      <form id="formAddItem" class="grid grid-cols-1 sm:grid-cols-5 gap-3">
        <input type="text" id="newItemName" required placeholder="${addPlaceholder}" class="sm:col-span-3 border border-ledger-line rounded-lg px-3.5 py-2.5 text-sm">
        <input type="number" id="newItemAmount" required min="0" placeholder="Nominal (Rp)" class="border border-ledger-line rounded-lg px-3.5 py-2.5 text-sm">
        <button type="submit" class="bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg">+ Tambah</button>
      </form>
    </div>

    ${items.length === 0 ? `
      <div class="bg-white border border-ledger-line rounded-2xl p-8 text-center text-slate-400 text-sm">Belum ada item pembayaran ${label.toLowerCase()}. Tambahkan lewat form di atas.</div>
    ` : `
      <div class="flex items-center gap-2 mb-4 flex-wrap">
        ${items.map(it => `
          <button data-select-item="${it.id}" class="pill-item ${it.id===selectedId?'active':''} border border-ledger-line rounded-full px-3.5 py-1.5 text-xs font-semibold bg-white text-slate-600 hover:border-teal-600">
            ${escapeHtml(it.name)} · ${formatRupiah(it.amount)}
          </button>`).join('')}
      </div>
      ${renderItemTable(wallet, items.find(i=>i.id===selectedId), type)}
    `}
  `;

  document.getElementById('formAddItem').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('newItemName').value.trim();
    const amount = parseFloat(document.getElementById('newItemAmount').value) || 0;
    if(!name || amount <= 0) return;
    const newItem = { id: uid('item'), name, amount, type };
    wallet.paymentItems.push(newItem);
    if(isBuku) selectedBukuItemId = newItem.id; else selectedLainnyaItemId = newItem.id;
    saveState(); showToast(`Item ${label.toLowerCase()} ditambahkan`); render();
  });

  root.querySelectorAll('[data-select-item]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(isBuku) selectedBukuItemId = btn.dataset.selectItem; else selectedLainnyaItemId = btn.dataset.selectItem;
      render();
    });
  });

  const delBtn = root.querySelector('[data-del-item]');
  if(delBtn){
    delBtn.addEventListener('click', () => {
      const itemId = delBtn.dataset.delItem;
      const item = wallet.paymentItems.find(i => i.id === itemId);
      openModal(confirmModal('Hapus Item?', `Item "${escapeHtml(item.name)}" beserta seluruh status pembayarannya akan dihapus permanen.`, () => {
        wallet.paymentItems = wallet.paymentItems.filter(i => i.id !== itemId);
        if(state.paymentData[wallet.id]) delete state.paymentData[wallet.id][itemId];
        if(isBuku) selectedBukuItemId = null; else selectedLainnyaItemId = null;
        saveState(); closeModal(); showToast('Item dihapus', 'info'); render();
      }));
    });
  }

  root.querySelectorAll('[data-item-student]').forEach(sel => {
    sel.addEventListener('change', () => {
      const rec = ensurePaymentBucket(wallet.id, sel.dataset.itemId, sel.dataset.itemStudent);
      rec.status = sel.value;
      if(rec.status !== 'beli') rec.paid = false;
      saveState(); render();
    });
  });
  root.querySelectorAll('[data-item-paid]').forEach(chk => {
    chk.addEventListener('change', () => {
      const rec = ensurePaymentBucket(wallet.id, chk.dataset.itemId, chk.dataset.itemPaid);
      rec.paid = chk.checked;
      saveState(); render();
    });
  });
}

function renderItemTable(wallet, item, type){
  if(!item) return '';
  return `
    <div class="bg-white border border-ledger-line rounded-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-ledger-line flex items-center justify-between flex-wrap gap-2">
        <div>
          <h3 class="font-display font-bold text-slate-800">${escapeHtml(item.name)}</h3>
          <p class="text-xs text-slate-400">Nominal: ${formatRupiah(item.amount)}</p>
        </div>
        <button data-del-item="${item.id}" class="text-rose-500 hover:text-rose-700 text-xs font-semibold border border-rose-200 rounded-lg px-3 py-1.5">Hapus Item Ini</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[520px]">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left px-5 py-3 font-semibold">Nama Siswa</th>
              <th class="text-center px-3 py-3 font-semibold">Status</th>
              <th class="text-center px-3 py-3 font-semibold">Lunas?</th>
              <th class="text-right px-5 py-3 font-semibold">Keterangan</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-ledger-line">
            ${state.students.map(s => {
              const rec = ensurePaymentBucket(wallet.id, item.id, s.id);
              let text, cls;
              if(rec.status === 'tidak'){ text = 'Tuntas (Tidak Membeli)'; cls = 'text-slate-400'; }
              else if(rec.status === 'beli' && rec.paid){ text = 'Lunas'; cls = 'text-teal-700'; }
              else if(rec.status === 'beli' && !rec.paid){ text = formatRupiah(item.amount) + ' (Tunggakan)'; cls = 'text-amber-600'; }
              else { text = '—'; cls = 'text-slate-400'; }
              return `
                <tr class="hover:bg-slate-50/60">
                  <td class="px-5 py-3 font-medium text-slate-800">${escapeHtml(s.name)}</td>
                  <td class="px-3 py-3 text-center">
                    <select data-item-student="${s.id}" data-item-id="${item.id}" class="border border-ledger-line rounded-lg px-2 py-1.5 text-xs font-medium bg-white">
                      <option value="" ${rec.status===''?'selected':''}>Belum Ditentukan</option>
                      <option value="beli" ${rec.status==='beli'?'selected':''}>Beli</option>
                      <option value="tidak" ${rec.status==='tidak'?'selected':''}>Tidak Membeli</option>
                    </select>
                  </td>
                  <td class="px-3 py-3 text-center">
                    <input type="checkbox" class="chk" data-item-paid="${s.id}" data-item-id="${item.id}" ${rec.paid?'checked':''} ${rec.status!=='beli'?'disabled':''}>
                  </td>
                  <td class="px-5 py-3 text-right font-semibold tabular-nums ${cls}">${text}</td>
                </tr>`;
            }).join('') || `<tr><td colspan="4" class="px-5 py-8 text-center text-slate-400">Belum ada siswa.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

              <th class="text-center px-3 py-3 font-semibold">Aksi</th>

          </thead>
          <tbody class="divide-y divide-ledger-line">
            ${list.map(e => `
              <tr class="hover:bg-slate-50/60">
                <td class="px-5 py-3 font-medium text-slate-800">${escapeHtml(e.desc)}</td>
                <td class="px-3 py-3 text-right tabular-nums">${formatRupiah(e.price)}</td>
                <td class="px-3 py-3 text-right tabular-nums">${e.qty} pcs</td>

            <label class="text-xs font-semibold text-slate-500 mb-1 block">Nominal Kas per Minggu</label>
            <input type="number" id="setWeekly" value="${wallet.weeklyAmount}" min="0" required class="w-full border border-ledger-line rounded-lg px-3 py-2.5 text-sm">
          </div>
          <p class="text-xs text-slate-400">Nominal buku &amp; pembayaran lainnya kini diatur langsung per item di tab Pembayaran Buku / Lainnya, sehingga tiap item bisa punya harga custom sendiri.</p>
          <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg">Simpan Pengaturan</button>
        </form>
        ${state.wallets.length > 1 ? `
        <button id="btnDeleteWallet" class="mt-3 w-full text-rose-600 hover:bg-rose-50 border border-rose-200 text-sm font-semibold px-4 py-2.5 rounded-lg">Hapus Wallet "${escapeHtml(wallet.name)}"</button>` : ''}
      </div>

      <div class="bg-white border border-ledger-line rounded-2xl p-5">
        <h3 class="font-display font-bold text-slate-800 mb-4">Kelola Bulan (Kas &amp; Pengeluaran)</h3>
        <form id="formAddMonth" class="flex gap-2 mb-4">
          <select id="setMonthName" class="flex-1 border border-ledger-line rounded-lg px-3 py-2.5 text-sm">
            ${BULAN_LIST.map(b => `<option value="${b}">${b}</option>`).join('')}
          </select>
          <input type="number" id="setMonthYear" value="${new Date().getFullYear()}" class="w-24 border border-ledger-line rounded-lg px-3 py-2.5 text-sm">
          <button type="submit" class="bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg whitespace-nowrap">+ Tambah</button>
        </form>
        <ul class="space-y-2 max-h-64 overflow-y-auto">
          ${(wallet.months||[]).map(m => `
            <li class="flex items-center justify-between bg-slate-50 rounded-lg px-3.5 py-2.5">
              <span class="text-sm font-medium text-slate-700">${m}</span>
              <button data-del-month="${m}" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Hapus</button>

      <form id="formNewWalletInline" class="flex flex-col sm:flex-row gap-3">

      <div class="flex flex-col sm:flex-row gap-3">
        <button id="btnBackup" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
          Unduh Cadangan (JSON)
        </button>
        <label class="flex-1 cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2.5 rounded-lg flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20V8m0 0l-4 4m4-4l4 4M4 4h16"/></svg>
          Pulihkan dari File
          <input type="file" id="inputRestore" accept="application/json" class="hidden">
        </label>
      </div>
    </div>`;

  document.getElementById('formWalletSettings').addEventListener('submit', (e) => {
    e.preventDefault();
    wallet.name = document.getElementById('setWalletName').value.trim() || wallet.name;
    wallet.weeklyAmount = parseFloat(document.getElementById('setWeekly').value) || 0;
    saveState(); showToast('Pengaturan wallet disimpan'); render();
  });

  const btnDel = document.getElementById('btnDeleteWallet');
  if(btnDel){
    btnDel.addEventListener('click', () => {
      openModal(confirmModal('Hapus Wallet?', `Seluruh data kas, pembayaran, dan pengeluaran pada wallet "${escapeHtml(wallet.name)}" akan dihapus permanen.`, () => {
        state.wallets = state.wallets.filter(w => w.id !== wallet.id);
        delete state.kasData[wallet.id]; delete state.paymentData[wallet.id]; delete state.expenses[wallet.id];
        state.activeWalletId = state.wallets[0].id;
        saveState(); closeModal(); showToast('Wallet dihapus', 'info'); render();
      }));
    });
  }

  document.getElementById('formAddMonth').addEventListener('submit', (e) => {
    e.preventDefault();
    const label = `${document.getElementById('setMonthName').value} ${document.getElementById('setMonthYear').value}`;
    if(!wallet.months) wallet.months = [];
    if(wallet.months.includes(label)){ showToast('Bulan sudah ada', 'error'); return; }
    wallet.months.push(label);
    saveState(); showToast('Bulan ditambahkan'); render();
  });

  root.querySelectorAll('[data-del-month]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.delMonth;
      openModal(confirmModal('Hapus Bulan?', `Data kas &amp; pengeluaran untuk bulan "${m}" pada seluruh siswa akan dihapus permanen.`, () => {
        wallet.months = wallet.months.filter(x => x !== m);
        Object.keys(state.kasData[wallet.id]||{}).forEach(sid => { delete state.kasData[wallet.id][sid][m]; });
        if(state.expenses[wallet.id]) delete state.expenses[wallet.id][m];
        saveState(); closeModal(); showToast('Bulan dihapus', 'info'); render();
      }));
    });
  });

  document.getElementById('formNewWalletInline').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('newWalletNameInline').value.trim();
    if(!name) return;
    createWallet(name);
  });

  document.getElementById('btnBackup').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const tanggal = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `cadangan-kas-kelas-${tanggal}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Cadangan berhasil diunduh');
  });

  document.getElementById('inputRestore').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if(!imported.wallets || !Array.isArray(imported.wallets)) throw new Error('Format tidak valid');
        openModal(confirmModal('Pulihkan Data?', 'Data saat ini di aplikasi ini akan DIGANTI dengan data dari file cadangan. Pastikan Anda sudah mengunduh cadangan data saat ini jika masih diperlukan.', () => {
          state = normalizeState(imported);
          saveState(); closeModal(); showToast('Data berhasil dipulihkan'); currentTab = 'dashboard'; render();
        }));
      } catch(err){
        showToast('File cadangan tidak valid', 'error');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
}

function createWallet(name){
  const newWallet = { id: uid('wal'), name, weeklyAmount: 5000, months: [], paymentItems: [] };
  state.wallets.push(newWallet);
  state.activeWalletId = newWallet.id;
  saveState(); showToast('Wallet baru dibuat: ' + name);
  currentTab = 'pengaturan'; render();
}

/* ==========================================================================
   PDF EXPORT
   ========================================================================== */
function exportSummaryPDF(walletId){
  const wallet = getWallet(walletId);
  const fin = computeWalletFinance(walletId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });

  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('Laporan Ringkasan Kas Kelas', 14, 16);
  doc.setFontSize(10); doc.setFont('helvetica', 'normal');
  doc.text(`Wallet: ${wallet.name}`, 14, 23);
  doc.text(`Tanggal cetak: ${new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })}`, 14, 28);

  doc.autoTable({
    startY: 34,
    head: [['Ringkasan Keuangan', 'Nominal']],
    body: [
      ['Total Pemasukan', formatRupiah(fin.totalPemasukan)],
      ['Total Pengeluaran', formatRupiah(fin.totalPengeluaran)],
      ['Sisa Kas / Saldo Akhir', formatRupiah(fin.sisaKas)],
      ['Total Tunggakan Kelas', formatRupiah(fin.totalTunggakan)],
    ],
    theme: 'grid', headStyles: { fillColor: [15, 118, 110] }, styles: { fontSize: 10 },
    tableWidth: 120,
  });

  const studentBody = state.students.map(s => {
    const d = computeStudentDetail(walletId, s.id);
    return [
      s.name,
      String(d.mingguLunas),
      String(d.mingguBelum),
      formatRupiah(d.totalPaid),
      d.totalTunggakan > 0 ? formatRupiah(d.totalTunggakan) : 'Lunas',
      d.itemBelum > 0 ? `${d.itemBelum} item belum lunas` : 'Lunas',
    ];
  });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 10,
    head: [['Nama Siswa', 'Minggu Lunas', 'Minggu Belum', 'Total Dibayar', 'Total Tunggakan', 'Status Buku/Lainnya']],
    body: studentBody,
    theme: 'striped', headStyles: { fillColor: [15, 118, 110] }, styles: { fontSize: 9 },
    columnStyles: { 1:{halign:'center'}, 2:{halign:'center'}, 3:{halign:'right'}, 4:{halign:'right'} }
  });

  doc.save(`Laporan_Ringkasan_${wallet.name.replace(/\s+/g,'_')}.pdf`);
  showToast('Laporan ringkasan berhasil diekspor');
}

function exportStudentPDF(walletId, studentId){
  const wallet = getWallet(walletId);
  const student = state.students.find(s => s.id === studentId);
  const d = computeStudentDetail(walletId, studentId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('Laporan Pembayaran Siswa', 14, 18);
  doc.setFontSize(11); doc.text(`Nama: ${student.name}`, 14, 27);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(`Wallet: ${wallet.name}`, 14, 33);
  doc.text(`Tanggal cetak: ${new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })}`, 14, 38);

  doc.autoTable({
    startY: 44,
    head: [['Ringkasan', 'Nilai']],
    body: [
      ['Total Sudah Dibayar', formatRupiah(d.totalPaid)],
      ['Total Tunggakan', formatRupiah(d.totalTunggakan)],
      ['Minggu Kas Lunas', `${d.mingguLunas} minggu`],
      ['Minggu Kas Belum Bayar', `${d.mingguBelum} minggu`],
      ['Item Buku/Lainnya Lunas', `${d.itemLunas} item`],
      ['Item Buku/Lainnya Belum Bayar', `${d.itemBelum} item`],
    ],
    theme: 'grid', headStyles: { fillColor: [15, 118, 110] }, styles: { fontSize: 10 },
  });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 8,
    head: [['Rincian Minggu Kas Belum Dibayar']],
    body: d.unpaidWeeks.length ? d.unpaidWeeks.map(x => [x]) : [['Tidak ada tunggakan kas — semua minggu lunas.']],
    theme: 'striped', headStyles: { fillColor: [217, 119, 6] }, styles: { fontSize: 9 },
  });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 8,
    head: [['Rincian Item Buku/Lainnya Belum Dibayar']],
    body: d.unpaidItems.length ? d.unpaidItems.map(x => [x]) : [['Tidak ada tunggakan buku/lainnya — semua item lunas.']],
    theme: 'striped', headStyles: { fillColor: [217, 119, 6] }, styles: { fontSize: 9 },
  });

  doc.save(`Laporan_${student.name.replace(/\s+/g,'_')}.pdf`);
  showToast('Laporan siswa berhasil diekspor');
}

      <input type="text" id="modalNewWalletName" required placeholder="Contoh: Kas Sosial" class="w-full border border-ledger-line rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <button type="button" onclick="closeModal()" class="text-sm font-semibold px-4 py-2 rounded-lg border border-ledger-line text-slate-600 hover:bg-slate-50">Batal</button>
        <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-lg bg-teal-700 hover:bg-teal-800 text-white">Buat Wallet</button>
      </div>
    </form>`);
  document.getElementById('modalNewWalletForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('modalNewWalletName').value.trim();
    if(!name) return;
    closeModal(); createWallet(name);
  });
});

/* ==========================================================================
   PWA: registrasi service worker (agar bisa "Install App" / Add to Home Screen di Android)
   ========================================================================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW gagal didaftarkan:', err));
  });
}

/* ==========================================================================
   INIT
   ========================================================================== */
render();
</script>
